name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.x is the floor `engines.node` declares. 24.x is what the numbers in
        # the README were measured on, and the only one of the two where
        # `node:sqlite` is certain to be present -- on the other, the SQLite
        # target reports `unverifiable` rather than passing, which is the point
        # of having a third outcome.
        node: ['22.14.0', '24.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # `npm ci` installs from the committed lockfile and fails if package.json
      # and the lockfile disagree, which is the point of pinning them.
      - run: npm ci

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: the committed crash report is not stale
        run: npm run check:report

      - name: test suite
        run: npm test

      # Run the headline claims as their own steps so a regression is visible in
      # the job list rather than buried in test output.
      - name: the negative control
        run: node src/cli.js control

      - name: the planted fixtures
        run: node src/cli.js fixtures

      - name: the three real targets
        run: node src/cli.js targets --every 4

      - name: the committed report still reproduces
        run: node src/cli.js verify crashes.json

      - name: the one-command demo
        run: node src/cli.js demo

  windows:
    # cofferdam is developed on Windows, its module resolution depends on
    # pathToFileURL, and NTFS is the filesystem its real-target numbers were
    # measured against. Running the suite on both keeps that honest.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - run: npm ci
      - run: npm test
      - run: node src/cli.js targets --every 4
